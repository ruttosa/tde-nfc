<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha del vehículo</title>
<meta name="description" content="Información del vehículo escaneado por NFC">
<meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f4;
    --card: #ffffff;
    --text: #111113;
    --muted: #71717a;
    --line: #e7e5e4;
    --accent: #111113;
    --chip: #f4f4f5;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 32px -12px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0c0d;
      --card: #161618;
      --text: #f4f4f5;
      --muted: #8b8b94;
      --line: #26262a;
      --accent: #f4f4f5;
      --chip: #1f1f23;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 8px; }
  .brand { font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .nfc {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500; color: var(--muted);
    background: var(--card); border: 1px solid var(--line);
    padding: 6px 10px; border-radius: 999px;
  }
  .nfc .dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
  .nfc.demo .dot { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.2); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }

  .hero { padding: 28px 24px 24px; position: relative; overflow: hidden; }
  .hero .swatch-bg {
    position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%;
    background: var(--vc, #d4d4d8); opacity: .12; filter: blur(4px);
  }
  .eyebrow { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
  .model { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; margin-top: 8px; word-break: break-word; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .tag {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--chip); border-radius: 999px; padding: 7px 12px;
    font-size: 13px; font-weight: 500;
  }
  .tag .sw { width: 12px; height: 12px; border-radius: 50%; background: var(--vc, #d4d4d8); box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }

  .vin { padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .vin .value { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; letter-spacing: .06em; margin-top: 6px; word-break: break-all; }
  .copy {
    flex: none; border: 1px solid var(--line); background: transparent; color: var(--text);
    width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
    display: grid; place-items: center; transition: background .15s, transform .1s;
  }
  .copy:hover { background: var(--chip); }
  .copy:active { transform: scale(.95); }
  .copy svg { width: 18px; height: 18px; }

  dl { display: grid; grid-template-columns: 1fr 1fr; }
  .item { padding: 18px 24px; border-top: 1px solid var(--line); }
  .item:nth-child(odd) { border-right: 1px solid var(--line); }
  .item:nth-child(-n+2) { border-top: 0; }
  dt { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
  dd { font-size: 16px; font-weight: 600; margin-top: 6px; word-break: break-word; }
  dd.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 500; font-size: 15px; }

  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 0 4px; line-height: 1.6; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--accent); color: var(--bg); font-size: 13px; font-weight: 500;
    padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .fade { animation: fade .5s ease both; }
  .fade:nth-child(2) { animation-delay: .05s; }
  .fade:nth-child(3) { animation-delay: .1s; }
  .fade:nth-child(4) { animation-delay: .15s; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }

  @media (max-width: 360px) {
    dl { grid-template-columns: 1fr; }
    .item:nth-child(odd) { border-right: 0; }
    .item:nth-child(2) { border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<main>
  <header class="fade">
    <span class="brand">Ficha técnica</span>
    <span class="nfc" id="source"><span class="dot"></span><span id="sourceText">Leído por NFC</span></span>
  </header>

  <section class="card hero fade">
    <div class="swatch-bg"></div>
    <p class="eyebrow">Modelo</p>
    <h1 class="model" id="modelo">—</h1>
    <div class="tags">
      <span class="tag"><span class="sw"></span><span id="colorTag">—</span></span>
      <span class="tag" id="anioTag">—</span>
    </div>
  </section>

  <section class="card vin fade">
    <div>
      <p class="eyebrow">VIN</p>
      <p class="value" id="vin">—</p>
    </div>
    <button class="copy" id="copyVin" type="button" aria-label="Copiar VIN">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
    </button>
  </section>

  <section class="card fade">
    <dl>
      <div class="item"><dt>Motor</dt><dd class="mono" id="motor">—</dd></div>
      <div class="item"><dt>Pedido</dt><dd class="mono" id="pedido">—</dd></div>
      <div class="item"><dt>Color</dt><dd id="color">—</dd></div>
      <div class="item"><dt>Año</dt><dd id="anio">—</dd></div>
    </dl>
  </section>

  <footer>Información almacenada en la etiqueta NFC del vehículo.</footer>
</main>
<div class="toast" id="toast">VIN copiado</div>

<script>
  // Datos leídos desde la URL. Se aceptan claves largas o cortas
  // (las cortas ahorran espacio en etiquetas NFC pequeñas, p. ej. NTAG213).
  var FIELDS = {
    vin:    ["vin", "v"],
    motor:  ["motor", "m"],
    color:  ["color", "c"],
    pedido: ["pedido", "p"],
    modelo: ["modelo", "mo"],
    anio:   ["anio", "año", "ano", "a"]
  };

  // Datos de ejemplo si la URL no trae parámetros.
  var DEMO = {
    vin: "9BRA78BF8V3006997",
    motor: "2TBR391947",
    color: "ROJO",
    pedido: "NBQ2435",
    modelo: "TGN156L-SDMLK",
    anio: "2026"
  };

  var COLORS = {
    rojo: "#dc2626", azul: "#2563eb", negro: "#111113", blanco: "#f5f5f5",
    gris: "#6b7280", plata: "#c0c4cc", plateado: "#c0c4cc", verde: "#16a34a",
    amarillo: "#eab308", naranja: "#ea580c", marron: "#78350f", "marrón": "#78350f",
    beige: "#d6c7a1", dorado: "#c9a227", bordo: "#7f1d1d", "bordó": "#7f1d1d",
    celeste: "#38bdf8", violeta: "#7c3aed"
  };

  var params = new URLSearchParams(window.location.search);
  var data = {};
  var found = false;
  Object.keys(FIELDS).forEach(function (key) {
    var val = null;
    FIELDS[key].some(function (k) { val = params.get(k); return val; });
    if (val) found = true;
    data[key] = val ? val.trim() : "";
  });
  if (!found) {
    data = DEMO;
    document.getElementById("source").classList.add("demo");
    document.getElementById("sourceText").textContent = "Ejemplo";
  }

  function set(id, value) { document.getElementById(id).textContent = value || "—"; }
  set("modelo", data.modelo);
  set("vin", data.vin);
  set("motor", data.motor);
  set("pedido", data.pedido);
  set("color", data.color);
  set("anio", data.anio);
  set("colorTag", data.color);
  set("anioTag", data.anio);

  var swatch = COLORS[(data.color || "").toLowerCase()];
  if (swatch) document.documentElement.style.setProperty("--vc", swatch);
  if (data.modelo) document.title = data.modelo + " · Ficha del vehículo";

  var toast = document.getElementById("toast"), timer;
  document.getElementById("copyVin").addEventListener("click", function () {
    if (!data.vin) return;
    var done = function () {
      toast.classList.add("show");
      clearTimeout(timer);
      timer = setTimeout(function () { toast.classList.remove("show"); }, 1600);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(data.vin).then(done).catch(function () {});
  });
</script>
</body>
</html>
